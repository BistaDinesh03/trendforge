<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640"
     role="img" aria-label="TrendForge social preview">
  <title>TrendForge — see what's trending, build what's missing</title>
  <defs>
    <mask id="tf-sp-mark" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <path fill="#fff" d="M13 2.077 L20.093 6.173 A2 2 0 0 1 21.093 7.905 L21.093 16.095
        A2 2 0 0 1 20.093 17.827 L13 21.923 A2 2 0 0 1 11 21.923 L3.907 17.827
        A2 2 0 0 1 2.907 16.095 L2.907 7.905 A2 2 0 0 1 3.907 6.173 L11 2.077
        A2 2 0 0 1 13 2.077 Z"/>
      <path fill="none" stroke="#000" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"
            d="M7.8 15.2 L11.6 11.4 L14 13.8 L16.2 11.1"/>
      <circle cx="16.2" cy="11.1" r="3.4" fill="#000"/>
    </mask>
  </defs>

  <!-- Opaque background, solid slate-900 -->
  <rect width="1280" height="640" fill="#0F172A"/>

  <!-- Mark: 120x120 centered (x=580), y=96..216 -->
  <g transform="translate(580 96) scale(5)">
    <rect width="24" height="24" fill="#F8FAFC" mask="url(#tf-sp-mark)"/>
  </g>

  <text x="640" y="304" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="72" font-weight="700" letter-spacing="-1.5" fill="#F8FAFC">TrendForge</text>

  <text x="640" y="352" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="26" font-weight="400" fill="#94A3B8">See what&apos;s trending. Build what&apos;s missing.</text>

  <text x="640" y="568" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="18" font-weight="500" fill="#94A3B8">github.com/BistaDinesh03/trendforge</text>
</svg>
