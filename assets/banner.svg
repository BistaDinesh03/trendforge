<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320"
     role="img" aria-label="TrendForge — see what's trending, build what's missing">
  <title>TrendForge — see what's trending, build what's missing</title>
  <defs>
    <mask id="tf-b-mark" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <path fill="#fff" d="M13 2.077 L20.093 6.173 A2 2 0 0 1 21.093 7.905 L21.093 16.095
        A2 2 0 0 1 20.093 17.827 L13 21.923 A2 2 0 0 1 11 21.923 L3.907 17.827
        A2 2 0 0 1 2.907 16.095 L2.907 7.905 A2 2 0 0 1 3.907 6.173 L11 2.077
        A2 2 0 0 1 13 2.077 Z"/>
      <path fill="none" stroke="#000" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"
            d="M7.8 15.2 L11.6 11.4 L14 13.8 L16.2 11.1"/>
      <circle cx="16.2" cy="11.1" r="3.4" fill="#000"/>
    </mask>
  </defs>

  <!-- Mark: 96x96 box, x=64, y=112 (vertically centered), 24px gap to text -->
  <g transform="translate(64 112) scale(4)">
    <rect width="24" height="24" fill="#0F172A" mask="url(#tf-b-mark)"/>
  </g>

  <!-- Wordmark: baseline y=160 = mark vertical center (112 + 48) -->
  <text x="184" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="64" font-weight="700" letter-spacing="-1" fill="#0F172A">TrendForge</text>

  <!-- Tagline: baseline y=200, below wordmark, no overlap with mark or wordmark -->
  <text x="184" y="200" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="22" font-weight="400" fill="#475569">See what&apos;s trending. Build what&apos;s missing.</text>

  <!-- Repo URL: bottom-right, baseline y=256 (64px above canvas bottom) -->
  <text x="1216" y="256" text-anchor="end"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="16" font-weight="500" fill="#94A3B8">github.com/BistaDinesh03/trendforge</text>
</svg>
