name: Bug report
description: Something in TrendForge broke or produced a wrong report.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security issues, use the private channel
        described in [SECURITY.md](https://github.com/BistaDinesh03/trendforge/blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA you ran.
      placeholder: "v0.1.0"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran and what it printed.
      placeholder: "`python main.py --dry-run` failed while fetching issues."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps to reproduce. Paste the relevant log lines (redact tokens).
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected instead.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
