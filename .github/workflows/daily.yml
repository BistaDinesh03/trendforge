name: Daily TrendForge

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendforge
  cancel-in-progress: false

jobs:
  trendforge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Push with an owner PAT (PUSH_TOKEN) and commit as the maintainer,
          # not github-actions[bot]. The built-in GITHUB_TOKEN cannot satisfy
          # the protect-main ruleset on a personal repo. Forks without the
          # secret fall back to GITHUB_TOKEN and the push step will fail.
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run TrendForge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
        run: python main.py

      - name: Commit and push results
        run: |
          git config user.name "BistaDinesh03"
          git config user.email "BistaDinesh03@users.noreply.github.com"
          git add reports data generated README.md
          git commit -m "trendforge: daily report $(date -u +%F)" || exit 0
          git push
