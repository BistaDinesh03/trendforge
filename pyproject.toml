[project]
name = "trendforge"
version = "1.0.0"
description = "Daily GitHub Trending analysis that designs and scaffolds an original open-source project."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "PyGithub>=2.3",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "openai>=1.30",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6", "bandit>=1.7.9"]

[tool.ruff]
line-length = 100
target-version = "py312"
# TrendForge only owns its own files; backend/ belongs to the sibling
# application in this repository and is linted by its own CI.
extend-exclude = ["backend", "node_modules", "backups"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests assert by design; generated scaffolds ship smoke tests that assert too.
"tests/**" = ["S101"]
"generated/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
